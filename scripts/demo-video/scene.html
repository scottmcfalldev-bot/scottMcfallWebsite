<!doctype html>
<meta charset="utf-8">
<title>Demo video scene</title>
<style>html,body{margin:0;background:#F6F5F2}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// A 10 second loop: one status update, typed once, lands in five tools.
// draw(t) is deterministic so render.mjs can capture it frame by frame.
// Two layouts: wide (1600x640, rendered 1920x768) and, with ?portrait,
// a phone cut (600x900, rendered 1080x1620) with larger type.
const PORTRAIT = location.search.includes('portrait');
const L = PORTRAIT ? {
  W: 600, H: 900, S: 1.8,
  card: { x: 30, y: 30, w: 540, h: 220 },
  dot: [32, 40], label: [50, 46], labelSize: 15,
  msgSize: 28, msgX: 28, msgY: 92, msgLH: 38, cursorH: 30,
  btn: { w: 150, h: 46, x: 28, fromBottom: 64, size: 18 },
  cap: { x: 30, y1: 822, y2: 860, size: 30 },
  chips: { x: 84, w: 486, h: 86, gap: 12, y0: 290 },
  nameSize: 21, wroteSize: 17, trunkX: 56,
} : {
  W: 1600, H: 640, S: 1.2,
  card: { x: 70, y: 76, w: 480, h: 330 },
  dot: [38, 44], label: [56, 50], labelSize: 16,
  msgSize: 31, msgX: 32, msgY: 110, msgLH: 44, cursorH: 34,
  btn: { w: 168, h: 52, x: 32, fromBottom: 84, size: 19 },
  cap: { x: 70, y1: 76 + 330 + 74, y2: 76 + 330 + 118, size: 34 },
  chips: { x: 1000, w: 530, h: 92, gap: 14, y0: (640 - (5 * 92 + 4 * 14)) / 2 },
  nameSize: 21, wroteSize: 17,
};
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = L.W, H = L.H, DUR = 10, S = L.S;
c.width = W * S; c.height = H * S; c.style.width = W + 'px'; c.style.height = H + 'px';
const INK = '#1C1917', SOFT = '#78716C', LINE = '#DEDAD4', BG = '#F6F5F2', CARD = '#FFFFFF', GREEN = '#3F6B4F';
const FONT = 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const clamp = (v) => Math.min(1, Math.max(0, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const out = (t) => 1 - Math.pow(1 - clamp(t), 3);
const MSG = 'McFall Prod signed the contract. Onboarding starts Monday.';
// Same five colours as the strand animation on the page.
const DESTS = [
  { name: 'Asana task',           glyph: 'A', color: '#C2643F', wrote: 'McFall Prod onboarding project · kickoff Mon' },
  { name: 'Slack · #client-mcfall', glyph: '#', color: '#C99A2E', wrote: 'New client: McFall Prod. Kickoff Monday.' },
  { name: 'Client email',         glyph: '@', color: '#4F6D8F', wrote: 'Subject: Welcome aboard, McFall Prod' },
  { name: 'Budget sheet',         glyph: '$', color: '#8A5A7A', wrote: 'McFall Prod added · billing starts Mon' },
  { name: 'CRM note',             glyph: 'C', color: '#3F8A8A', wrote: 'McFall Prod: deal won, onboarding started' },
];

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
          u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]];
}
function wrap(text, maxW) {
  const lines = [''];
  for (const w of text.split(' ')) {
    const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
    if (ctx.measureText(tryLine).width > maxW && lines[lines.length - 1]) lines.push(w);
    else lines[lines.length - 1] = tryLine;
  }
  return lines;
}

function draw(t) {
  t = ((t % DUR) + DUR) % DUR;
  const fade = 1 - io(seg(t, 9.1, 9.9));
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // faint dot grid, so the scene reads as a workspace
  ctx.fillStyle = '#E4E0DA';
  for (let x = 40; x < W; x += 40) for (let y = 40; y < H; y += 40) ctx.fillRect(x - 1, y - 1, 2, 2);

  // ── the update card ──
  const { x: cx, y: cy, w: cw, h: ch } = L.card;
  ctx.shadowColor = 'rgba(40,30,20,0.12)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
  rr(cx, cy, cw, ch, 16); ctx.fillStyle = CARD; ctx.fill();
  ctx.shadowColor = 'transparent';
  rr(cx, cy, cw, ch, 16); ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(cx + L.dot[0], cy + L.dot[1], 6, 0, 7); ctx.fill();
  ctx.fillStyle = SOFT; ctx.font = `600 ${L.labelSize}px ${FONT}`; ctx.textBaseline = 'alphabetic';
  ctx.fillText('NEW CLIENT', cx + L.label[0], cy + L.label[1]);

  const typed = MSG.slice(0, Math.floor(seg(t, 0.5, 2.5) * MSG.length));
  ctx.font = `500 ${L.msgSize}px ${FONT}`;
  ctx.globalAlpha = fade; ctx.fillStyle = INK;
  const lines = wrap(typed, cw - L.msgX * 2);
  lines.forEach((l, i) => ctx.fillText(l, cx + L.msgX, cy + L.msgY + i * L.msgLH));
  if (t < 2.8 && Math.floor(t * 2.5) % 2 === 0) {
    const last = lines[lines.length - 1];
    ctx.fillRect(cx + L.msgX + 3 + ctx.measureText(last).width, cy + L.msgY - L.cursorH + 7 + (lines.length - 1) * L.msgLH, 3, L.cursorH);
  }
  ctx.globalAlpha = 1;

  // button
  const press = io(seg(t, 2.65, 2.8)) * (1 - io(seg(t, 2.8, 3.0)));
  const sent = io(seg(t, 2.85, 3.15)) * fade;
  const bw = L.btn.w, bh = L.btn.h, bx = cx + L.btn.x, by = cy + ch - L.btn.fromBottom;
  ctx.save();
  ctx.translate(bx + bw / 2, by + bh / 2); ctx.scale(1 - press * 0.06, 1 - press * 0.06);
  rr(-bw / 2, -bh / 2, bw, bh, 10);
  ctx.fillStyle = sent > 0.5 ? GREEN : INK; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `600 ${L.btn.size}px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText(sent > 0.5 ? 'Sent ✓' : 'Send once', 0, 7);
  ctx.restore(); ctx.textAlign = 'left';
  // ripple off the button when it sends
  const rip = seg(t, 2.8, 3.5);
  if (rip > 0 && rip < 1) {
    ctx.globalAlpha = (1 - rip) * 0.5; ctx.strokeStyle = GREEN; ctx.lineWidth = 2;
    rr(bx - rip * 14, by - rip * 14, bw + rip * 28, bh + rip * 28, 10 + rip * 10); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ── caption ──
  const cap = io(seg(t, 6.3, 7.0)) * fade;
  ctx.globalAlpha = cap; ctx.font = `700 ${L.cap.size}px ${FONT}`;
  ctx.fillStyle = INK; ctx.fillText('Typed once.', L.cap.x, L.cap.y1 + (1 - cap) * 12);
  ctx.fillStyle = GREEN; ctx.fillText('Updated in five places.', L.cap.x, L.cap.y2 + (1 - cap) * 12);
  ctx.globalAlpha = 1;

  // ── five destinations ──
  const { x, w, h, gap, y0 } = L.chips, off = (h - 92) / 2;
  DESTS.forEach((d, i) => {
    const y = y0 + i * (h + gap);
    const start = 3.0 + i * 0.36, p = io(seg(t, start, start + 0.95));
    const done = out(seg(t, start + 0.9, start + 1.35)) * fade;
    const pop = Math.sin(seg(t, start + 0.9, start + 1.25) * Math.PI) * 0.025;
    // wide: card's right edge across to each chip. portrait: down a trunk on the left, branching right.
    const p3 = [x, y + h / 2];
    const p0 = PORTRAIT ? [L.trunkX, cy + ch] : [cx + cw, cy + ch / 2];
    const p1 = PORTRAIT ? [L.trunkX, p0[1] + (p3[1] - p0[1]) * 0.6] : [p0[0] + 210, p0[1]];
    const p2 = PORTRAIT ? [L.trunkX, p3[1]] : [p3[0] - 210, p3[1]];

    // dotted guide, then the drawn path (green at the source, the tool's colour at the end)
    ctx.lineWidth = 2; ctx.setLineDash([3, 8]); ctx.strokeStyle = '#D2CDC5';
    ctx.beginPath(); ctx.moveTo(...p0); ctx.bezierCurveTo(...p1, ...p2, ...p3); ctx.stroke();
    ctx.setLineDash([]);
    if (p > 0) {
      const g = PORTRAIT ? ctx.createLinearGradient(0, p0[1], 0, p3[1]) : ctx.createLinearGradient(p0[0], 0, p3[0], 0);
      g.addColorStop(0, GREEN); g.addColorStop(PORTRAIT ? 0.8 : 0.35, GREEN); g.addColorStop(1, d.color);
      ctx.globalAlpha = fade; ctx.strokeStyle = g; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(...p0);
      for (let k = 1; k <= 60; k++) ctx.lineTo(...bez(p0, p1, p2, p3, (k / 60) * p));
      ctx.stroke();
      if (p < 1) {
        for (let k = 3; k >= 0; k--) {           // head with a short trail
          const [hx, hy] = bez(p0, p1, p2, p3, Math.max(0, p - k * 0.025));
          ctx.globalAlpha = fade * (1 - k * 0.24);
          ctx.beginPath(); ctx.arc(hx, hy, 8 - k * 1.4, 0, 7); ctx.fillStyle = d.color; ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // chip
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2); ctx.scale(1 + pop, 1 + pop); ctx.translate(-(x + w / 2), -(y + h / 2));
    ctx.shadowColor = 'rgba(40,30,20,0.07)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    rr(x, y, w, h, 14); ctx.fillStyle = CARD; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.stroke();
    if (done > 0) { ctx.globalAlpha = done; rr(x, y, w, h, 14); ctx.strokeStyle = d.color; ctx.lineWidth = 2.5; ctx.stroke(); ctx.globalAlpha = 1; }

    // tool badge
    rr(x + 20, y + 22 + off, 48, 48, 12); ctx.fillStyle = d.color; ctx.globalAlpha = 0.16 + 0.84 * done; ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = done > 0.5 ? '#fff' : d.color; ctx.font = `700 24px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(d.glyph, x + 44, y + 55 + off); ctx.textAlign = 'left';

    ctx.fillStyle = INK; ctx.font = `600 ${L.nameSize}px ${FONT}`; ctx.fillText(d.name, x + 86, y + 40 + off);
    // shrink the written line a touch if it would run under the check
    const room = w - 150;
    let fs = L.wroteSize;
    ctx.font = `400 ${fs}px ${FONT}`;
    while (ctx.measureText(d.wrote).width > room && fs > 12) { fs -= 0.5; ctx.font = `400 ${fs}px ${FONT}`; }
    ctx.fillStyle = SOFT; ctx.globalAlpha = 1 - done; ctx.fillText('waiting', x + 86, y + 68 + off);
    // what got written, wiped in from the left
    ctx.globalAlpha = done; ctx.save();
    ctx.beginPath(); ctx.rect(x + 86, y + 48 + off, room * done, 30); ctx.clip();
    ctx.fillStyle = '#57534E'; ctx.fillText(d.wrote, x + 86, y + 68 + off);
    ctx.restore();
    // check
    ctx.beginPath(); ctx.arc(x + w - 40, y + h / 2, 14 * done, 0, 7); ctx.fillStyle = GREEN; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x + w - 46.5, y + h / 2); ctx.lineTo(x + w - 41.5, y + h / 2 + 5); ctx.lineTo(x + w - 33.5, y + h / 2 - 5); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  });
}
window.draw = draw;
// Live preview when opened directly.
if (!location.search.includes('render')) (function loop(n) { draw(n / 1000); requestAnimationFrame(loop); })(0);
</script>
